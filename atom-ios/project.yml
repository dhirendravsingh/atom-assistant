name: atom-ios
options:
  bundleIdPrefix: com.dhiren
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true
  groupSortPosition: top
  xcodeVersion: "16.0"
packages:
  AtomCore:
    path: .
settings:
  base:
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
targets:
  atom-ios:
    type: application
    platform: iOS
    sources:
      - path: AtomIOS
    dependencies:
      - package: AtomCore
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: AtomIOS/Resources/Info.plist
        MARKETING_VERSION: 0.1.0
        PRODUCT_BUNDLE_IDENTIFIER: com.dhiren.atom-ios
        PRODUCT_NAME: atom-ios
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - AtomIOSTests
  AtomIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AtomIOSTests
    dependencies:
      - target: atom-ios
      - package: AtomCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.dhiren.atom-ios.tests
